<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkTap · Diseño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        ink: "#111111",
        surface: "#1C1C1C",
        inset: "#262626",
        line: "#3A3A3A",
        paper: "#F4F4F4",
        muted: "#A3A3A3",
        libre: "#4E9A68",
        ocupado: "#D25555",
        accesible: "#4C78B0",
        asfalto: "#171717",
        marca: "#E8E8E8",
        auto: "#D4D4D4"
      },
      fontFamily: {
        sans: ["Space Grotesk", "system-ui", "sans-serif"],
        mono: ["JetBrains Mono", "ui-monospace", "monospace"]
      }
    }
  }
};
</script>
<style>
  [data-state="libre"] { background: color-mix(in srgb, #4E9A68 28%, transparent); border-color: #4E9A68; }
  [data-state="ocupado"] { background: color-mix(in srgb, #D25555 32%, transparent); border-color: #D25555; }
  [data-state="accesible"] { background: color-mix(in srgb, #4C78B0 32%, transparent); border-color: #4C78B0; }
  [data-state="infraccion"] { background: color-mix(in srgb, #D25555 40%, transparent); border-color: #D25555; animation: blink 1s steps(2) infinite; }
  [data-state="ocupado"] .auto,
  [data-state="infraccion"] .auto,
  [data-state="accesible"] .silla { display: grid; }
  .parpadea { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) {
    [data-state="infraccion"], .parpadea { animation: none; }
    [data-state="infraccion"] { outline: 3px solid #F4F4F4; }
  }
</style>
</head>
<body class="bg-ink text-paper font-sans antialiased">

<header class="sticky top-0 z-10 flex flex-wrap items-center justify-between gap-3 border-b border-line bg-surface px-5 py-3">
  <div class="flex items-center gap-2 text-xl font-bold tracking-tight">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E7E7E7" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg>
    ParkTap
  </div>
  <button id="modo" type="button" class="inline-flex min-h-10 items-center gap-2 rounded-full border border-line bg-inset px-4 text-sm font-medium" aria-pressed="false">
    <span id="modo-dot" class="h-2.5 w-2.5 rounded-full bg-muted"></span>
    <span id="modo-txt">Modo simulación</span>
  </button>
</header>

<main class="mx-auto grid max-w-[1400px] gap-4 p-4 lg:grid-cols-[minmax(0,1fr)_340px]">
  <section class="rounded-xl border border-line bg-surface p-4" aria-label="Mapa del estacionamiento">
    <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Lote de la demo</h1>
        <p class="text-sm text-muted">Vista desde arriba · da clic en un cajón para ocuparlo o liberarlo</p>
      </div>
      <ul class="flex flex-wrap gap-3 text-xs text-muted">
        <li class="inline-flex items-center gap-1.5"><i class="h-3 w-3 rounded-sm bg-libre"></i>Libre</li>
        <li class="inline-flex items-center gap-1.5"><i class="h-3 w-3 rounded-sm bg-ocupado"></i>Ocupado</li>
        <li class="inline-flex items-center gap-1.5"><i class="h-3 w-3 rounded-sm bg-accesible"></i>Accesible</li>
        <li class="inline-flex items-center gap-1.5"><i class="parpadea h-3 w-3 rounded-sm bg-ocupado"></i>Infracción</li>
      </ul>
    </div>

    <div class="rounded-lg bg-asfalto p-3">
      <div id="fila-a" class="grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-6"></div>

      <div class="relative my-3 flex h-16 items-center justify-between px-2">
        <span class="rounded-full border border-marca px-3 py-1 text-xs font-bold tracking-wide text-marca">ENTRADA</span>
        <svg class="absolute left-28 right-8 h-6 text-marca" viewBox="0 0 640 24" fill="currentColor" aria-hidden="true">
          <rect y="10" width="640" height="4" opacity=".35"/>
          <path d="M80 4h28l14 8-14 8H80l14-8zM220 4h28l14 8-14 8h-28l14-8zM360 4h28l14 8-14 8h-28l14-8zM500 4h28l14 8-14 8h-28l14-8z"/>
        </svg>
        <span class="relative text-xs font-bold tracking-wide text-marca">CALLE</span>
      </div>

      <div id="fila-b" class="grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-6"></div>
    </div>
  </section>

  <aside class="flex flex-col gap-4">
    <section class="rounded-xl border border-line bg-surface p-4">
      <h2 class="text-xs font-medium uppercase tracking-widest text-muted">Ocupación</h2>
      <p class="mt-2 text-4xl font-bold leading-none">Quedan <span id="quedan">0</span> de 12</p>
    </section>

    <section class="rounded-xl border border-line bg-surface p-4">
      <h2 class="text-xs font-medium uppercase tracking-widest text-muted">Alertas</h2>
      <ul id="alertas" class="mt-3 space-y-2 text-sm"></ul>
    </section>

    <section class="rounded-xl border border-line bg-surface p-4">
      <h2 class="text-xs font-medium uppercase tracking-widest text-muted">Registro en vivo</h2>
      <ul id="registro" class="mt-3 space-y-2 text-sm"></ul>
    </section>
  </aside>
</main>

<script>
const silla = `<span class="silla absolute left-1/2 top-1/2 hidden h-8 w-8 -translate-x-1/2 -translate-y-1/2 place-items-center rounded-md bg-accesible text-paper" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="4" r="2" fill="currentColor" stroke="none"/><path d="M12 7v6h5l2 5"/><path d="M9 10a6 6 0 1 0 6 8"/></svg></span>`;
const auto = `<svg class="auto absolute left-1/2 top-1/2 hidden h-16 w-10 -translate-x-1/2 -translate-y-1/2" viewBox="0 0 80 120" aria-hidden="true"><rect x="14" y="8" width="52" height="104" rx="16" fill="#D4D4D4"/><rect x="22" y="20" width="36" height="24" rx="4" fill="#141414" opacity=".65"/><rect x="22" y="78" width="36" height="16" rx="4" fill="#141414" opacity=".4"/></svg>`;

const cajones = [
  { id: "A-01", acc: true, state: "accesible", plate: null },
  { id: "A-02", acc: true, state: "infraccion", plate: "KLM-219-B" },
  { id: "A-03", acc: false, state: "ocupado", plate: "PRT-903-C" },
  { id: "A-04", acc: false, state: "libre", plate: null },
  { id: "A-05", acc: false, state: "libre", plate: null },
  { id: "A-06", acc: false, state: "ocupado", plate: "DSA-118-A" },
  { id: "B-01", acc: false, state: "ocupado", plate: "MNB-774-C" },
  { id: "B-02", acc: false, state: "libre", plate: null },
  { id: "B-03", acc: false, state: "libre", plate: null },
  { id: "B-04", acc: false, state: "libre", plate: null },
  { id: "B-05", acc: false, state: "ocupado", plate: "QWE-650-B" },
  { id: "B-06", acc: false, state: "libre", plate: null }
];
const placas = ["FTR-482-A", "HJK-208-C", "ZXC-331-A", "RTY-412-A"];
const alertas = [{ t: "08:41", txt: "A-02 · KLM-219-B · sin permiso accesible" }];
const registro = [
  { t: "08:41", txt: "Entrada · KLM-219-B en A-02" },
  { t: "08:37", txt: "Entrada · QWE-650-B en B-05" },
  { t: "08:30", txt: "Salida · HJK-208-C de B-03" }
];

const $ = (id) => document.getElementById(id);
const hora = () => new Date().toTimeString().slice(0, 5);

function etiqueta(c) {
  if (c.state === "infraccion") return `${c.id} en infracción`;
  if (c.state === "accesible") return `${c.id} accesible libre`;
  if (c.state === "ocupado") return `${c.id} ocupado`;
  return `${c.id} libre`;
}

function pintar() {
  for (const fila of ["A", "B"]) {
    const host = $(fila === "A" ? "fila-a" : "fila-b");
    host.innerHTML = cajones.filter((c) => c.id.startsWith(fila)).map((c) => `
      <button type="button" data-id="${c.id}" data-state="${c.state}" aria-label="${etiqueta(c)}"
        class="relative h-36 rounded-md border-2 text-left ${fila === "B" ? "[&_.auto]:rotate-180" : ""}">
        <span class="absolute left-2 top-2 text-xs font-bold">${c.id}</span>
        ${c.plate ? `<span class="absolute bottom-2 left-2 right-2 truncate font-mono text-[10px] text-paper/80">${c.plate}</span>` : ""}
        ${silla}${auto}
      </button>`).join("");
    host.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => alternar(btn.dataset.id));
    });
  }
  const libres = cajones.filter((c) => c.state === "libre" || c.state === "accesible").length;
  $("quedan").textContent = libres;
  $("alertas").innerHTML = alertas.slice(0, 4).map((a) =>
    `<li class="rounded-md bg-inset px-3 py-2"><time class="font-mono text-xs text-muted">${a.t}</time><div>${a.txt}</div></li>`
  ).join("") || `<li class="text-muted">Sin alertas</li>`;
  $("registro").innerHTML = registro.slice(0, 6).map((r) =>
    `<li class="flex gap-3 border-b border-line py-2 last:border-0"><time class="font-mono text-xs text-muted">${r.t}</time><span>${r.txt}</span></li>`
  ).join("");
}

function alternar(id) {
  const c = cajones.find((x) => x.id === id);
  const t = hora();
  if (c.state === "libre" || c.state === "accesible") {
    c.plate = placas[Math.floor(Math.random() * placas.length)];
    c.state = c.acc ? "infraccion" : "ocupado";
    registro.unshift({ t, txt: `Entrada · ${c.plate} en ${c.id}` });
    if (c.acc) alertas.unshift({ t, txt: `${c.id} · ${c.plate} · sin permiso accesible` });
  } else {
    registro.unshift({ t, txt: `Salida · ${c.plate} de ${c.id}` });
    c.plate = null;
    c.state = c.acc ? "accesible" : "libre";
  }
  pintar();
}

$("modo").addEventListener("click", () => {
  const btn = $("modo");
  const sim = btn.getAttribute("aria-pressed") === "true";
  btn.setAttribute("aria-pressed", String(!sim));
  $("modo-txt").textContent = sim ? "Modo simulación" : "NFC conectado";
  $("modo-dot").className = sim ? "h-2.5 w-2.5 rounded-full bg-muted" : "h-2.5 w-2.5 rounded-full bg-libre";
});

pintar();
</script>
</body>
</html>
